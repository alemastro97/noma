name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # NOMA is macOS-only (NSPanel windows, Metal speech model). Apple Silicon build.
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Do not tune whisper.cpp for the build machine's CPU.
          GGML_NATIVE: "OFF"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NOMA ${{ github.ref_name }}
          releaseBody: |
            Unsigned build for Apple Silicon. On macOS, after moving NOMA to Applications run:
            `xattr -dr com.apple.quarantine /Applications/NOMA.app`
          releaseDraft: true
          prerelease: true
          args: --target aarch64-apple-darwin
