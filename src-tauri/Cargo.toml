[package]
name = "noma"
version = "0.0.0"
description = "NOMA — your second mind. Personal AI desktop companion."
authors = ["Alessandro Mastropasqua"]
license = "MIT"
edition = "2024"

[lib]
name = "noma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
