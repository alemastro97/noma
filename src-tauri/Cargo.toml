[package]
name = "noma"
version = "0.4.0"
description = "NOMA — your second mind. Personal AI desktop companion."
authors = ["Alessandro Mastropasqua"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"
default-run = "noma"

[lib]
name = "noma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
log = "0.4"
rusqlite = { version = "0.41", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v7"] }
rrule = "0.14"
thiserror = "2"
iana-time-zone = "0.1"
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["process", "time", "sync", "fs", "io-util", "macros", "rt-multi-thread"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
strsim = "0.11"
cpal = "0.18"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSGraphics"] }
tauri-nspanel = "2.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
